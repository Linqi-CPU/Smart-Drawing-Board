name: Build and Release Windows EXE

on:
  push:
    branches:
      - master
      - main
    # tag push 也要触发，否则 `git push origin v0.2.0` 之后
    # 下面那个 "Create GitHub Release" 步骤永远进不去，
    # README 的下载链接会一直指向一个空 Release 页。
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PyInstaller
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            build/pyi-work
            build/pyi-spec
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pyinstaller-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE
        run: |
          python build_exe.py

      - name: Package artifacts
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'dist'
          $releaseDir = Join-Path $PWD 'release'
          if (Test-Path $releaseDir) { Remove-Item -Recurse -Force $releaseDir }
          New-Item -ItemType Directory -Path $releaseDir | Out-Null

          Compress-Archive -Path (Join-Path $dist 'SmartDrawingBoard-Launcher\*') -DestinationPath (Join-Path $releaseDir 'SmartDrawingBoard-Launcher.zip') -Force
          Compress-Archive -Path (Join-Path $dist 'SmartDrawingBoard-Main\*') -DestinationPath (Join-Path $releaseDir 'SmartDrawingBoard-Main.zip') -Force
          Compress-Archive -Path (Join-Path $dist 'SmartDrawingBoard-Page\*') -DestinationPath (Join-Path $releaseDir 'SmartDrawingBoard-Page.zip') -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartDrawingBoard-Windows
          path: |
            release/*.zip
          retention-days: 14
          compression-level: 9
          if-no-files-found: error

      # 只在**tag push** 时创建 Release。
      # workflow_dispatch 不建 Release：手动触发多半只是想验证构建，
      # 不该顺手往 Release 列表里塞一个没有版本号含义的产物。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
